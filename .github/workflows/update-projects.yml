```yaml
name: Update GitHub Projects

on:
  # Update automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual updates from GitHub Actions
  workflow_dispatch:

  # Update when changes are pushed to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      # =========================================
      # Checkout profile repository
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # Update Projects section
      # =========================================
      - name: Update Projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python <<'PY'

          import json
          import re
          import subprocess


          # =========================================
          # GitHub username
          # =========================================

          USERNAME = "Prayush-Shrestha"


          # =========================================
          # README file
          # =========================================

          README_FILE = "README.md"


          # =========================================
          # README markers
          # =========================================

          START_MARKER = "<!-- PROJECTS:START -->"
          END_MARKER = "<!-- PROJECTS:END -->"


          # =========================================
          # Get GitHub repositories
          # =========================================

          command = [
              "gh",
              "repo",
              "list",
              USERNAME,
              "--limit",
              "100",
              "--visibility",
              "public",
              "--json",
              "name,description,url,isPrivate,isFork,updatedAt"
          ]


          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
              check=True
          )


          repositories = json.loads(result.stdout)


          # =========================================
          # Keep only public non-fork repositories
          # =========================================

          repositories = [
              repo
              for repo in repositories
              if repo["isPrivate"] is False
              and repo["isFork"] is False
          ]


          # =========================================
          # Sort by most recently updated
          # =========================================

          repositories.sort(
              key=lambda repo: repo["updatedAt"],
              reverse=True
          )


          # =========================================
          # Generate project list
          # =========================================

          projects = []


          for repo in repositories:

              name = repo["name"]
              description = repo["description"]


              # Use default description if none exists
              if not description:
                  description = (
                      "A project developed by Prayush Shrestha."
                  )


              project = f"""## {name}

          {description}

          **Repository:**  
          [{name}]({repo["url"]})

          """


              projects.append(project)


          # =========================================
          # Combine projects
          # =========================================

          projects_content = "\n".join(projects)


          # =========================================
          # Read README
          # =========================================

          with open(
              README_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              readme = file.read()


          # =========================================
          # Check markers
          # =========================================

          if START_MARKER not in readme:
              raise Exception(
                  "PROJECTS:START marker not found in README.md"
              )


          if END_MARKER not in readme:
              raise Exception(
                  "PROJECTS:END marker not found in README.md"
              )


          # =========================================
          # Create new Projects section
          # =========================================

          new_section = (
              START_MARKER
              + "\n\n"
              + projects_content
              + END_MARKER
          )


          # =========================================
          # Replace old Projects section
          # =========================================

          pattern = (
              re.escape(START_MARKER)
              + r".*?"
              + re.escape(END_MARKER)
          )


          updated_readme = re.sub(
              pattern,
              new_section,
              readme,
              flags=re.DOTALL
          )


          # =========================================
          # Save README
          # =========================================

          with open(
              README_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(updated_readme)


          # =========================================
          # Display results
          # =========================================

          print(
              f"Found {len(repositories)} public repositories."
          )


          for repo in repositories:
              print(f"- {repo['name']}")


          print(
              "README Projects section updated successfully."
          )

          PY


      # =========================================
      # Commit README changes
      # =========================================
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update projects"
            git push
          fi
```
