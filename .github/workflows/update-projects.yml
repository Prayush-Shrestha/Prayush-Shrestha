name: Update GitHub Projects

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

env:
  GITHUB_USERNAME: "Prayush-Shrestha"
  README_FILE: "README.md"
  PROJECTS_START: "<!-- PROJECTS:START -->"
  PROJECTS_END: "<!-- PROJECTS:END -->"

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import re
          import subprocess
          import os

          USERNAME = os.environ["GITHUB_USERNAME"]
          README_FILE = os.environ["README_FILE"]
          START_MARKER = os.environ["PROJECTS_START"]
          END_MARKER = os.environ["PROJECTS_END"]

          # Get public repositories
          command = [
              "gh",
              "repo",
              "list",
              USERNAME,
              "--limit",
              "100",
              "--visibility",
              "public",
              "--json",
              "name,description,url,isPrivate,isFork,updatedAt",
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
              check=True,
          )

          repositories = json.loads(result.stdout)

          # Keep public, non-fork repositories only
          repositories = [
              repo
              for repo in repositories
              if not repo["isPrivate"] and not repo["isFork"]
          ]

          # Show most recently updated projects first
          repositories.sort(
              key=lambda repo: repo["updatedAt"],
              reverse=True,
          )

          # Generate README project entries
          projects = []

          for repo in repositories:
              name = repo["name"]
              description = (
                  repo["description"]
                  or "A project developed by Prayush Shrestha."
              )

              projects.append(
                  f"""## {name}

          {description}

          **Repository:**  
          [{name}]({repo["url"]})

          """
              )

          projects_content = "\n".join(projects)

          # Read README
          with open(README_FILE, "r", encoding="utf-8") as file:
              readme = file.read()

          # Validate markers
          if START_MARKER not in readme:
              raise RuntimeError(
                  "PROJECTS:START marker not found in README.md"
              )

          if END_MARKER not in readme:
              raise RuntimeError(
                  "PROJECTS:END marker not found in README.md"
              )

          # Replace Projects section
          new_section = (
              f"{START_MARKER}\n\n"
              f"{projects_content}"
              f"{END_MARKER}"
          )

          pattern = (
              re.escape(START_MARKER)
              + r".*?"
              + re.escape(END_MARKER)
          )

          updated_readme = re.sub(
              pattern,
              new_section,
              readme,
              flags=re.DOTALL,
          )

          # Save README
          with open(README_FILE, "w", encoding="utf-8") as file:
              file.write(updated_readme)

          # Display summary
          print(f"Found {len(repositories)} public repositories.")

          for repo in repositories:
              print(f"- {repo['name']}")

          print("Projects section updated successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update projects"
            git push
          fi
